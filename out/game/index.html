<style>
  html, body { margin: 0; padding: 0; background: #070a20; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { text-align: center; }
  canvas { display: block; width: min(960px, 96vw); height: auto; border-radius: 12px;

  button { margin-top: 8px; background: #ffd678; color: #3a2b00; border: 0; border-radius: 8px;
    padding: 6px 14px; font-weight: 700; cursor: pointer; }
</style>

<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <p>Starlight Shepherd — WASD move · Mouse aim · Click / Space shoot · Shift dash · M mute</p>
  <button id="mute" type="button">Mute sound</button>
</div>
